name: Feature
description: A change in behaviour, with goals, non-goals and acceptance criteria
labels: [feature]
body:
  - type: textarea
    id: goal
    attributes: { label: Goal, description: What the user can do afterwards and why it matters }
    validations: { required: true }
  - type: textarea
    id: non-goals
    attributes: { label: Non-goals, description: What this deliberately does not do }
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes: { label: Acceptance criteria, description: Checkable statements; each becomes a test }
    validations: { required: true }
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: Adds a package, daemon route, screen or public config option (needs `scope-expanding`; the owner adds `scope-approved`)
  - type: input
    id: refs
    attributes: { label: References, description: ADR, spec or survey answer ids (e.g. core-027) }
